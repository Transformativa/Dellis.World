name: Probe Wikidata
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-pop.mjs
      - name: Save the report on its own branch
        run: |
          git config user.name "dellis-world-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b probe-output
          git add -f probe-report.json
          git commit -m "Wikidata probe report"
          git push -f origin probe-output
