<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danny's Apps · Dellis</title>
<meta name="description" content="Apps from Dellis, the home of Danny the Mighty Diver. Download to your phone.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Questrial&display=swap">
<style>
:root {
  --bg: #f7fef9; --surface: #ffffff; --fg: #232323; --muted: #4a4a4a; --line: #e1eae3;
  --accent: #232323; --accent-fg: #f7fef9; --link: #e44e0f; --green: #4cfc0f;
  --glow: rgba(76, 252, 15, .16); --grad: linear-gradient(90deg, #4cfc0f 0%, #f7fef9 100%);
  --font-display: "Questrial", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1510; --surface: #142019; --fg: #f7fef9; --muted: #a9b9ae; --line: #24352a;
    --accent: #f7fef9; --accent-fg: #0d1510; --link: #ff8969; --glow: rgba(76, 252, 15, .14);
    --grad: linear-gradient(90deg, #4cfc0f 0%, #0d1510 100%); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1510; --surface: #142019; --fg: #f7fef9; --muted: #a9b9ae; --line: #24352a;
  --accent: #f7fef9; --accent-fg: #0d1510; --link: #ff8969; --glow: rgba(76, 252, 15, .14);
  --grad: linear-gradient(90deg, #4cfc0f 0%, #0d1510 100%); color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.55; padding: 16px 16px 56px; }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { display: inline-flex; align-items: center; gap: 12px; }
.wordmark img { height: 40px; width: auto; }
.visit { font-size: .9rem; color: var(--link); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; background: var(--surface); }
.eyebrow { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 8px 0 0; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 10vw, 3.6rem); line-height: 1.04; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; background: var(--grad); padding: 0 .12em; border-radius: 8px; }
.lede { color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 4px var(--glow); }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.15; margin: 0; }
.card p { margin: 0; }
.price { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.price b { font-family: var(--font-display); font-weight: 400; font-size: 2rem; }
.price span { color: var(--muted); font-size: .92rem; }
ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font: inherit; font-weight: 600; text-decoration: none; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); }
.btn.alt { background: transparent; color: var(--fg); }
.btn.big { flex: 1 1 100%; }
.btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.soon { font-size: .9rem; color: var(--muted); }
.qr { display: flex; gap: 16px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.qr img { width: 112px; height: 112px; border-radius: 10px; background: #fff; padding: 6px; border: 1px solid var(--line); }
.qr p { color: var(--muted); font-size: .95rem; }
footer { color: var(--muted); font-size: .85rem; }
footer a { color: var(--link); }
a:focus-visible, .btn:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="wordmark" href="https://www.dellis.store" aria-label="Dellis"><img src="assets/dellis-mark.png" alt="" width="40" height="40"><img src="assets/dellis-wordmark.png" alt="Dellis" width="91" height="40"></a>
    <a class="visit" href="https://www.dellis.store">dellis.store</a>
  </div>
  <div>
    <p class="eyebrow">From the home of Danny the Mighty Diver</p>
    <h1>Danny's <em>Apps</em></h1>
  </div>
  <p class="lede">Download to your phone. Browse free. Unlock everything for $3.99 a year. No ads.</p>
  <div id="apps"></div>
  <footer>Facts come from the World Bank and Wikidata, refreshed every month. Made by <a href="https://www.dellis.store">Dellis</a>.</footer>
</div>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var device = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? "ios"
    : /Android/i.test(ua) ? "android" : "desktop";
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function link(cls, label, href) {
    var a = el("a", "btn " + cls, label);
    if (href) { a.href = href; a.rel = "noopener"; } else { a.setAttribute("aria-disabled", "true"); a.setAttribute("role", "link"); }
    return a;
  }
  fetch("apps.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (cfg) {
    var root = document.getElementById("apps");
    cfg.apps.forEach(function (app) {
      var card = el("section", "card");
      card.appendChild(el("h2", "", app.name));
      card.appendChild(el("p", "", app.tagline));
      var price = el("div", "price"); price.appendChild(el("b", "", app.price)); price.appendChild(el("span", "", app.priceNote)); card.appendChild(price);
      var ul = el("ul"); app.features.forEach(function (f) { ul.appendChild(el("li", "", f)); }); card.appendChild(ul);
      var live = app.status === "live";
      var btns = el("div", "btns");
      var ios = link(device === "ios" ? "big" : "", "Download on the App Store", live ? app.ios : "");
      var and = link(device === "android" ? "big" : "alt", "Get it on Google Play", live ? app.android : "");
      if (device === "ios") { btns.appendChild(ios); btns.appendChild(and); and.classList.add("alt"); }
      else if (device === "android") { btns.appendChild(and); btns.appendChild(ios); ios.classList.add("alt"); and.classList.remove("alt"); }
      else { btns.appendChild(ios); btns.appendChild(and); ios.classList.remove("big"); }
      card.appendChild(btns);
      if (!live) card.appendChild(el("p", "soon", "Coming soon to the App Store and Google Play."));
      if (device === "desktop") {
        var q = el("div", "qr");
        var img = el("img"); img.src = "assets/qr.svg"; img.alt = "QR code for this page. Scan it with your phone."; img.width = 112; img.height = 112;
        q.appendChild(img); q.appendChild(el("p", "", "On a computer? Scan this with your phone camera and download from there."));
        card.appendChild(q);
      }
      root.appendChild(card);
    });
  }).catch(function () {
    document.getElementById("apps").appendChild(el("p", "lede", "The app list did not load. Please refresh the page."));
  });
})();
</script>
</body>
</html>
